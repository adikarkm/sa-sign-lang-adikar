<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Recognition - Web App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-free {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-color);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.5rem;
            width: 100%;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video {
            transform: scaleX(-1);
        }

        #overlayCanvas {
            transform: scaleX(-1);
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);

        }

        .prediction-box {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .prediction-label {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .prediction-conf {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .prob-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .prob-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .prob-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .bar-bg {
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.15s ease-out;
        }

        .gesture-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .chip {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header>
        <h1>🤟 Sign Language Recognition Web App</h1>
        <span class="badge-free">100% Free & Open Source</span>
    </header>

    <div class="container">
        <div class="video-card">
            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="overlayCanvas"></canvas>
            </div>
            <div class="controls">
                <button id="toggleCamBtn" class="btn">
                    📷 Start Camera
                </button>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2>Real-Time Prediction</h2>
                <div class="prediction-box">
                    <div id="predLabel" class="prediction-label">WAITING...</div>
                    <div id="predConf" class="prediction-conf">Start camera to detect signs</div>
                </div>

                <h2>Confidence Breakdown</h2>
                <div class="prob-list" id="probList">
                    <!-- Progress bars injected via JS -->
                </div>
            </div>

            <div class="card">
                <h2>Supported Signs</h2>
                <div class="gesture-chips">
                    <span class="chip">african beer</span>
                    <span class="chip">hello</span>
                    <span class="chip">how</span>
                    <span class="chip">how are you</span>
                    <span class="chip">okay</span>
                    <span class="chip">think</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const toggleCamBtn = document.getElementById('toggleCamBtn');
        const predLabel = document.getElementById('predLabel');
        const predConf = document.getElementById('predConf');
        const probList = document.getElementById('probList');

        const CLASS_NAMES = ["african beer", "hello", "how", "how are you", "okay", "think"];
        let isCameraActive = false;
        let stream = null;
        let isProcessing = false;
        let frameInterval = null;

        // Initialize Probability Bars
        function initBars() {
            probList.innerHTML = '';
            CLASS_NAMES.forEach(name => {
                const item = document.createElement('div');
                item.className = 'prob-item';
                item.innerHTML = `
                    <div class="prob-header">
                        <span>${name}</span>
                        <span id="val-${name.replace(/\s+/g, '-')}">0.0%</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-${name.replace(/\s+/g, '-')}"></div>
                    </div>
                `;
                probList.appendChild(item);
            });
        }
        initBars();

        // Camera Toggle
        toggleCamBtn.addEventListener('click', async () => {
            if (isCameraActive) {
                stopCamera();
            } else {
                await startCamera();
            }
        });

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }
                });
                video.srcObject = stream;
                await video.play();

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                isCameraActive = true;
                toggleCamBtn.textContent = '⏹️ Stop Camera';
                toggleCamBtn.classList.add('btn-secondary');

                // Process frames every 150ms
                frameInterval = setInterval(captureAndPredict, 150);
            } catch (err) {
                alert('Could not access webcam: ' + err.message);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (frameInterval) clearInterval(frameInterval);

            video.srcObject = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            isCameraActive = false;
            toggleCamBtn.textContent = '📷 Start Camera';
            toggleCamBtn.classList.remove('btn-secondary');
            predLabel.textContent = 'STOPPED';
            predConf.textContent = 'Camera is inactive';
        }

        async function captureAndPredict() {
            if (!isCameraActive || isProcessing) return;
            isProcessing = true;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 640;
            tempCanvas.height = video.videoHeight || 480;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.7);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });

                const res = await response.json();
                if (res.success) {
                    updateUI(res);
                }
            } catch (err) {
                console.error('Prediction error:', err);
            } finally {
                isProcessing = false;
            }
        }

        function updateUI(res) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (res.hand_detected) {
                predLabel.textContent = res.label.toUpperCase();
                predConf.textContent = `Confidence: ${res.confidence}%`;

                // Draw Landmarks
                ctx.fillStyle = '#10b981';
                res.landmarks.forEach(hand => {
                    hand.forEach(pt => {
                        const x = pt.x * canvas.width;
                        const y = pt.y * canvas.height;
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fill();
                    });
                });
            } else {
                predLabel.textContent = 'NO HAND';
                predConf.textContent = 'Show hand to camera';
            }

            // Update Progress Bars
            if (res.predictions) {
                Object.entries(res.predictions).forEach(([name, val]) => {
                    const idKey = name.replace(/\s+/g, '-');
                    const valEl = document.getElementById(`val-${idKey}`);
                    const barEl = document.getElementById(`bar-${idKey}`);
                    if (valEl && barEl) {
                        valEl.textContent = `${val.toFixed(1)}%`;
                        barEl.style.width = `${val}%`;
                    }
                });
            }
        }
    </script>
</body>
</html>
